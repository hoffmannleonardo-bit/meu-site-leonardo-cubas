<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Site — Contato</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <a class="atalho" href="#principal">Pular para o conteúdo</a>
  <header class="topo">
    <span class="logo"><span aria-hidden="true">🌐</span> Site de Leonardo</span>
    <nav class="menu" aria-label="Navegação principal">
      <a href="index.html">Início</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html" class="ativo" aria-current="page">Contato</a>
    </nav>
  </header>

  <main id="principal">
    <section class="conteudo">
      <h1>Contato</h1>
      <p>Preencha o formulário abaixo para entrar em contato comigo.</p>

      <form class="form" action="#">
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome" />
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="voce@email.com" />
        </div>
        <div class="campo">
          <label for="msg">Mensagem</label>
          <textarea id="msg" name="msg" rows="4" placeholder="Escreva sua mensagem"></textarea>
        </div>
        <button type="submit" class="botao">Enviar</button>
      </form>
    </section>
  </main>

  <footer class="rodape">
    <p>Feito por Leonardo Cubas · Projeto Front-End · 2DAT2</p>
  </footer>

</body>
</html>
